name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Sync environment
        run: uv sync --frozen --group dev

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pyright
        run: uv run pyright

      - name: Layer contract
        run: uv run lint-imports

      - name: Function size budget
        run: uv run python tools/check_function_size.py

      - name: Tests
        run: uv run pytest

      - name: Process share (informational)
        run: uv run python tools/process_share.py
