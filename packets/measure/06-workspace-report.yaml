goal: >-
  Add a workspace section to `relay drift report`, read from the working tree:
  untracked files counted by top-level folder, stray environments (directories with
  a `pyvenv.cfg`, or named `node_modules`, except the root `.venv`), temp-pattern
  folders (tmp, temp, scratch, old, backup, tmp*, backup*, *.bak, *.old, *~), and
  the five largest ignored folders with their size. Include it in `--json` as
  "workspace". When the structural metrics cannot run, still print the hygiene and
  workspace sections and say why the structure was skipped, so the report works on
  any git repository. See issue #47.
issue: 47
