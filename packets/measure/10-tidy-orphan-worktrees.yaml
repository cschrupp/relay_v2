# Measurement task 10 of 12 (issue #41), configuration A and C.
# Run: relay run packets/measure/10-tidy-orphan-worktrees.yaml   (A); for C, see the tracking issue
# Before running, set base_sha to main's head so the task starts from current work.
goal: >-
  `relay tidy` lists directories under `<git common dir>/relay-worktrees/` that git
  no longer knows as worktrees, or whose branch no longer exists, and with `--apply`
  removes them (then `git worktree prune`). Dry run by default, like the rest of
  tidy. Never touch a directory git lists as a live worktree of an existing branch.
  See issue #41.
issue: 41
base_sha: "39b9e563a2f93f24110be859cf9e203bcacbc3a8"
allowed_paths:
  - src/relay/drift/tidy.py
  - src/relay/cli/format.py
  - src/relay/cli/main.py
  - tests/drift/**
  - tests/cli/**
expected_lines:
  source: 50
  tests: 50
acceptance_commands:
  - uv run ruff format --check .
  - uv run ruff check .
  - uv run pyright
  - uv run lint-imports
  - uv run python tools/check_function_size.py
  - uv run pytest
token_budget: 300000
role: implementer
tier: cheap
