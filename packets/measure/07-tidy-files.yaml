# Measurement task 7 of 12 (issue #48), configuration A.
# Run: relay run packets/measure/07-tidy-files.yaml
# Before running, set base_sha to main's head so the task starts from current work.
goal: >-
  Add `relay tidy --files`: list untracked files grouped by folder, with counts and
  sizes (dry run by default). `--include-ignored` adds ignored files, never tracked
  files, `.git` or the root `.venv`. `--apply` first writes every listed file to
  `<git common dir>/relay/archive/<YYYY-MM-DD>.tar.gz` (adding -2, -3 and so on,
  never overwriting), checks that the archive reads back, then removes the files and
  any directories left empty, and prints the archive path. If the archive fails,
  nothing is removed. Plain `relay tidy` is unchanged. See issue #48.
issue: 48
base_sha: "39b9e563a2f93f24110be859cf9e203bcacbc3a8"
allowed_paths:
  - src/relay/drift/**
  - src/relay/cli/format.py
  - src/relay/cli/main.py
  - tests/drift/**
  - tests/cli/**
expected_lines:
  source: 90
  tests: 80
acceptance_commands:
  - uv run ruff format --check .
  - uv run ruff check .
  - uv run pyright
  - uv run lint-imports
  - uv run python tools/check_function_size.py
  - uv run pytest
token_budget: 500000
role: implementer
tier: cheap
